<style id="unified-theme">

</head><body><main class="app"><div class="top"><h1>외화장부</h1><div class="autosaveBadge" id="autosaveBadge">✓ 자동저장 중</div><span>⚙️</span></div><div class="tabs"><button class="tab on" id="USD">달러 (USD)</button><button class="tab" id="JPY">엔화 (JPY)</button></div>
<div id="home" class="page show"><section class="card"><h2 id="assetTitle">🇺🇸 달러 보유 현황</h2><div class="balance" id="hold">$0.00</div><div class="grid"><div class="stat"><div class="lab">현재환율</div><div class="num" id="curShow">—</div></div><div class="stat"><div class="lab">평가금액</div><div class="num" id="value">—</div></div></div>
<div style="margin-top:12px"><div class="bigrow"><span>총 사용 현금 (매수)</span><b id="spent"></b></div><div class="bigrow"><span>원화 회수금액 (매도)</span><b id="recovered"></b></div><div class="bigrow"><span>순투입 현금</span><b id="net"></b></div><div class="bigrow"><span>평균 매입환율</span><b id="avg"></b></div><div class="bigrow"><span>실현손익 (매도)</span><b id="realized"></b></div><div class="bigrow"><span>평가손익 (보유)</span><b id="unrealized"></b></div><div class="bigrow" id="interestRow"><span>이자 누계</span><b id="interest"></b></div><div class="highlight"><span>총손익</span><b style="float:right" id="total"></b></div><div class="highlight"><span>총수익률</span><b style="float:right" id="roi"></b></div></div></section>
<section class="card"><h2>현재환율 입력</h2><div class="row"><label id="curLab">1$ 환율</label><input id="current" type="number" inputmode="decimal" placeholder="현재 환율"></div></section>
<section class="card" id="interestCard"><h2>💰 이자 현황</h2><div class="bigrow"><span>누적 이자</span><b id="interest2"></b></div><div class="hint">이자는 보유 외화에 합산되어 복리로 누적됩니다.</div></section></div>

<div id="trade" class="page"><section class="card"><h2>거래하기</h2><div class="types" id="types"></div><div class="row dateRow"><label>날짜</label><input id="date" type="date"></div><div class="row" id="rateRow"><label id="rateLab">거래환율</label><input id="rate" type="number" inputmode="decimal"></div><div class="row"><label>외화 금액</label><input id="amount" type="number" inputmode="decimal"></div><div class="flow"><span id="flowLab">예상 원화</span><span id="flow">₩0</span></div><button class="btn" id="save">거래 저장하기</button><div class="hint" id="help"></div></section></div>

<div id="history" class="page"><section class="card"><h2>거래내역</h2><div class="types" id="filters"></div><div id="list"></div></section></div>

<div id="stats" class="page"><section class="card"><h2>통계</h2><div class="bigrow"><span>총 원화 출금(매수)</span><b id="cashOut"></b></div><div class="bigrow"><span>총 원화 입금(매도)</span><b id="cashIn"></b></div><div class="bigrow"><span>순투입 현금</span><b id="net2"></b></div><div class="bigrow"><span>총손익</span><b id="total2"></b></div><div class="lab" style="margin-top:15px">보유 외화 비중</div><div class="bar"><i id="bar"></i></div></section><section class="card saveCard"><h2>저장 · 복원</h2>

</div>

<script>
const $=x=>document.getElementById(x),KEY='fxbook-ledger-v2';let cur='USD',typ='매수',filter='전체';
let db=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{USD:{tx:[],current:''},JPY:{tx:[],current:''}}}catch(e){return{USD:{tx:[],current:''},JPY:{tx:[],current:''}}}})();db.USD=db.USD||{tx:[],current:''};db.JPY=db.JPY||{tx:[],current:''};
const typesUSD=['매수','매도','출금','이자'],typesJPY=['매수','매도','출금'],typesNow=()=>cur==='USD'?typesUSD:typesJPY,sym=()=>cur==='USD'?'$':'¥',unit=()=>cur==='USD'?1:100,f=n=>Math.round(n||0).toLocaleString('ko-KR'),f2=n=>(+n||0).toLocaleString('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:2});function persist(){localStorage.setItem(KEY,JSON.stringify(db));showSaved()}
function stats(){let q=0,costQty=0,cb=0,spent=0,rec=0,real=0,int=0;for(let t of db[cur].tx){let a=+t.amount||0,r=+t.rate||0;if(t.type==='매수'){q+=a;costQty+=a;cb+=a/unit()*r;spent+=a/unit()*r}else if(t.type==='이자'&&cur==='USD'){q+=a;int+=a}else if(t.type==='입금'){q+=a}else if(t.type==='출금'){let x=Math.min(a,q),costTake=Math.min(x,costQty),av=costQty?cb/(costQty/unit()):0;q-=x;costQty-=costTake;cb-=costTake/unit()*av}else if(t.type==='매도'){let x=Math.min(a,q),costTake=Math.min(x,costQty),av=costQty?cb/(costQty/unit()):0,sale=x/unit()*r,cost=costTake/unit()*av;q-=x;costQty-=costTake;cb-=cost;rec+=sale;real+=sale-cost}}let av=costQty?cb/(costQty/unit()):0,cr=+db[cur].current||0,val=cr?q/unit()*cr:null,un=val===null?null:val-cb,total=un===null?null:real+un,roi=total===null||!spent?null:total/spent*100;return{q,costQty,cb,spent,rec,real,int,av,cr,val,un,total,roi}}
function signed(n){return(n>=0?'+':'-')+'₩'+f(Math.abs(n))}
function showSaved(){let e=document.getElementById('autosaveBadge');if(!e)return;e.textContent='✓ 자동저장 완료';e.style.opacity='1';clearTimeout(window.__saveBadgeTimer);window.__saveBadgeTimer=setTimeout(()=>{e.style.opacity='.72'},1600)}
function render(){let s=stats(),S=sym();$('assetTitle').textContent=(cur==='USD'?'🇺🇸 달러':'🇯🇵 엔화')+' 보유 현황';$('hold').textContent=S+f2(s.q);$('curShow').textContent=s.cr?'₩'+f2(s.cr):'—';$('value').textContent=s.val===null?'—':'₩'+f(s.val);$('spent').textContent='₩'+f(s.spent);$('recovered').textContent='₩'+f(s.rec);$('net').textContent='₩'+f(s.spent-s.rec);$('avg').textContent='₩'+f2(s.av);$('realized').textContent=signed(s.real);$('unrealized').textContent=s.un===null?'—':signed(s.un);$('interest').textContent=S+f2(s.int);$('interest2').textContent=S+f2(s.int);$('interestRow').style.display=cur==='USD'?'flex':'none';$('interestCard').style.display=cur==='USD'?'block':'none';$('total').textContent=s.total===null?'—':signed(s.total);$('roi').textContent=s.roi===null?'—':s.roi.toFixed(2)+'%';$('cashOut').textContent='₩'+f(s.spent);$('cashIn').textContent='₩'+f(s.rec);$('net2').textContent='₩'+f(s.spent-s.rec);$('total2').textContent=s.total===null?'—':signed(s.total);$('bar').style.width=Math.min(100,s.q?70:0)+'%';renderList()}
function renderList(){let a=db[cur].tx.map((t,i)=>({...t,i})).filter(t=>filter==='전체'||t.type===filter).reverse(),L=$('list');L.innerHTML='';for(let t of a){let sign=['매수','입금','이자'].includes(t.type)?'+':'-',e=document.createElement('div');e.className='item';e.innerHTML='<div><b>'+t.type+' '+sign+sym()+f2(t.amount)+'</b><div class="hint">'+t.date+(t.rate?' · 환율 ₩'+f2(t.rate):'')+'</div></div><button class="del" data-i="'+t.i+'">삭제</button>';L.appendChild(e)}if(!a.length)L.innerHTML='<div class="hint">거래내역이 없습니다.</div>'}
function chips(id,arr,active,fn){let b=$(id);b.innerHTML='';arr.forEach(x=>{let q=document.createElement('button');q.className='chip'+(x===active?' on':'');q.textContent=x;q.onclick=()=>fn(x);b.appendChild(q)})}
function typeUI(){if(!typesNow().includes(typ))typ='매수';chips('types',typesNow(),typ,x=>{typ=x;typeUI();preview()});$('rateRow').style.display=['매수','매도'].includes(typ)?'grid':'none';$('flowLab').textContent=typ==='매수'?'사용 원화 (예상)':typ==='매도'?'회수 원화 (예상)':'외화 변동';$('help').textContent=typ==='매도'?'평균 매입원가 기준으로 실현손익을 자동 계산합니다.':typ==='출금'?'외화 잔액만 감소하며 환차손익으로 계산하지 않습니다.':typ==='입금'?'외화 잔액만 증가합니다.':typ==='이자'?'보유 외화에 더해져 복리로 누적됩니다.':'매수금액은 총 사용 현금과 평균 매입환율에 반영됩니다.'}
function filterUI(){if(filter!=='전체'&&!typesNow().includes(filter))filter='전체';chips('filters',['전체',...typesNow()],filter,x=>{filter=x;filterUI();renderList()})}
function preview(){let a=+$('amount').value||0,r=+$('rate').value||0;$('flow').textContent=['매수','매도'].includes(typ)?'₩'+f(a/unit()*r):(['입금','이자'].includes(typ)?'+':'-')+sym()+f2(a)}
function switchCur(x){cur=x;$('USD').classList.toggle('on',x==='USD');$('JPY').classList.toggle('on',x==='JPY');$('curLab').textContent=x==='USD'?'1$ 환율':'100¥ 환율';$('rateLab').textContent=x==='USD'?'거래환율 (1$)':'거래환율 (100¥)';$('current').value=db[cur].current||'';typeUI();filterUI();render();preview()}
$('USD').onclick=()=>switchCur('USD');$('JPY').onclick=()=>switchCur('JPY');$('current').oninput=()=>{db[cur].current=$('current').value;persist();render()};$('amount').oninput=preview;$('rate').oninput=preview;
$('save').onclick=()=>{let a=+$('amount').value||0,r=+$('rate').value||0,d=$('date').value;if(!d||a<=0)return alert('날짜와 외화 금액을 입력해 주세요.');if(['매수','매도'].includes(typ)&&r<=0)return alert('거래환율을 입력해 주세요.');if(['매도','출금'].includes(typ)&&a>stats().q)return alert('보유 외화보다 큰 금액입니다.');db[cur].tx.push({type:typ,date:d,amount:a,rate:r});db[cur].tx.sort((a,b)=>a.date.localeCompare(b.date));$('amount').value=$('rate').value='';persist();render();preview();alert('저장했습니다.')};
$('list').onclick=e=>{let b=e.target.closest('[data-i]');if(b&&confirm('삭제할까요?')){db[cur].tx.splice(+b.dataset.i,1);persist();render()}};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));$(b.dataset.page).classList.add('show');b.classList.add('active')});
$('report').onclick=()=>{
 const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const unitOf=c=>c==='JPY'?100:1, symOf=c=>c==='JPY'?'¥':'$';
 const rows=c=>(db[c].tx||[]).map(t=>{
   const krw=(['매수','매도'].includes(t.type)&&t.rate)?((+t.amount||0)/unitOf(c)*(+t.rate||0)):0;
   return `<tr><td>${esc(t.date)}</td><td>${esc(t.type)}</td><td>${symOf(c)}${(+t.amount||0).toLocaleString('ko-KR',{maximumFractionDigits:2})}</td><td>${t.rate?'₩'+(+t.rate).toLocaleString('ko-KR',{maximumFractionDigits:2}):'-'}</td><td>${krw?'₩'+Math.round(krw).toLocaleString('ko-KR'):'-'}</td></tr>`
 }).join('')||'<tr><td colspan="5">거래내역이 없습니다.</td></tr>';
 const now=new Date(), ds=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
 const doc=`<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>외화장부 ${ds}</title>
 <style>body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:#f4f6f8;color:#101828;margin:0;padding:28px}.wrap{max-width:820px;margin:auto}.head{background:white;border-radius:22px;padding:26px;margin-bottom:18px}h1{margin:0 0 8px}h2{margin-top:28px}.sub{color:#667085}table{width:100%;border-collapse:collapse;background:white;border-radius:18px;overflow:hidden;margin-bottom:24px}th,td{padding:13px 10px;border-bottom:1px solid #eee;text-align:right}th{background:#f8fafc}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}@media print{body{background:white;padding:0}.head,table{box-shadow:none}}.backupActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.backupActions .ghost{height:48px;width:100%;font-size:14px;font-weight:700;padding:0 8px}.restoreRow{margin-top:10px;display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:center}.restoreBtn{height:48px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}.restoreFile{height:48px;display:flex;align-items:center;overflow:hidden;border:1px solid #d7dde5;border-radius:14px;background:#fff;padding:0 10px}.restoreFile input{width:100%;height:auto;border:0;padding:0;font-size:13px;background:transparent}@media(max-width:430px){.backupActions{gap:8px}.backupActions .ghost{font-size:13px}.restoreRow{grid-template-columns:105px minmax(0,1fr);gap:8px}.restoreBtn{font-size:13px}.restoreFile{padding:0 7px}.restoreFile input{font-size:12px}}</style>
 <div class="wrap"><div class="head"><h1>외화장부</h1><div class="sub">저장일 ${ds} · 달러/엔화 거래 기록</div></div>
 <h2>🇺🇸 달러 (USD)</h2><table><thead><tr><th>날짜</th><th>구분</th><th>외화금액</th><th>환율</th><th>원화금액</th></tr></thead><tbody>${rows('USD')}</tbody></table>
 <h2>🇯🇵 엔화 (JPY)</h2><table><thead><tr><th>날짜</th><th>구분</th><th>외화금액</th><th>환율</th><th>원화금액</th></tr></thead><tbody>${rows('JPY')}</tbody></table>
 <div class="sub">이 문서는 보기·인쇄용입니다. 앱 복원에는 ‘복원용 백업’ 파일을 사용하세요.</div></div></html>`;
 let a=document.createElement('a'),blob=new Blob([doc],{type:'text/html;charset=utf-8'});a.href=URL.createObjectURL(blob);a.download='외화장부_'+ds+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)
};
$('backup').onclick=()=>{let a=document.createElement('a'),blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='외화장부_복원용백업.json';a.click()};$('restore').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!x.USD||!x.JPY)throw 0;db=x;persist();switchCur(cur);alert('복원했습니다.')}catch(_){alert('올바른 백업 파일이 아닙니다.')}};
let n=new Date();$('date').value=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');typeUI();filterUI();switchCur('USD');
</script></body></html>
